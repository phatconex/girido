<!-- @dsCard height=288 -->
<style>
body{margin:0}
.cv{position:relative;width:960px;height:288px;background:var(--bg);overflow:hidden}
.cv svg{position:absolute;inset:0}
.cv-text{position:absolute;left:40px;bottom:32px;max-width:440px}
.cv-name{margin:0;font:800 104px/.95 var(--font-display);color:var(--ink)}
.cv-tag{margin:16px 0 0;font:700 14px/20px var(--font-body);color:var(--ink-soft)}
.b-water{fill:var(--water-500)}.b-leaf{fill:var(--tree-mid)}.b-sun{fill:var(--giri-fur)}.b-tint{fill:var(--blush)}.b-deep{fill:var(--water-600)}.dot{fill:var(--bg)}
</style>
<div class="cv">
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!--
    blocks: water-500 pill 128 x 272; tree-mid disc d=144; giri-fur disc d=80; blush pill 160 x 48; water-600 quarter disc r=96
    arrangement: one tall slab bleeding off the top, with satellites; the deep disc bleeds off the bottom-right corner
    pattern: discs (soft, friendly, large radii): the README says everything is rounded and work is counted in drops, so drops are cut out of the water slab in bg
    steps and radii: dots at space-6 pitch, r = space-1; pills at radius-pill (half the short side); insets space-10
    -->
    <rect class="b-water" x="528" y="-48" width="128" height="272" rx="64"/>
    <circle class="b-leaf" cx="776" cy="132" r="72"/>
    <circle class="b-sun" cx="892" cy="56" r="40"/>
    <rect class="b-tint" x="688" y="224" width="160" height="48" rx="24"/>
    <circle class="b-deep" cx="960" cy="288" r="96"/>
    <g class="dot">
      <circle cx="568" cy="24" r="4"/><circle cx="592" cy="24" r="4"/><circle cx="616" cy="24" r="4"/>
      <circle cx="568" cy="48" r="4"/><circle cx="592" cy="48" r="4"/><circle cx="616" cy="48" r="4"/>
      <circle cx="568" cy="72" r="4"/><circle cx="592" cy="72" r="4"/><circle cx="616" cy="72" r="4"/>
      <circle cx="568" cy="96" r="4"/><circle cx="592" cy="96" r="4"/><circle cx="616" cy="96" r="4"/>
      <circle cx="568" cy="120" r="4"/><circle cx="592" cy="120" r="4"/><circle cx="616" cy="120" r="4"/>
      <circle cx="568" cy="144" r="4"/><circle cx="592" cy="144" r="4"/><circle cx="616" cy="144" r="4"/>
    </g>
  </svg>
  <div class="cv-text">
    <h1 class="cv-name">Giri Garden</h1>
    <p class="cv-tag">Tưới từng việc nhỏ, hái trái việc lớn.</p>
  </div>
</div>
